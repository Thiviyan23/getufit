<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Classes - Get U Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Poppins',Arial,sans-serif;background:#000;color:#fff;min-height:100vh}
        a{color:#D4145A;text-decoration:none}
        header{display:flex;justify-content:space-between;align-items:center;padding:16px 40px;border-bottom:1px solid rgba(255,255,255,.08)}
        header .logo{color:#fff;font-weight:800;font-size:20px}
        header .logo span{color:#D4145A}
        header form{display:inline}
        .link{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:7px 18px;font-family:inherit;font-size:12px;cursor:pointer}
        .link:hover{border-color:#fff}
        main{max-width:1100px;margin:40px auto;padding:0 20px 60px}
        h1{font-size:30px;font-weight:800;margin:10px 0 20px}
        table{width:100%;border-collapse:collapse;background:#0f0f10}
        th,td{padding:14px;text-align:left;border-bottom:1px solid rgba(255,255,255,.08);font-size:14px}
        th{background:#1a1a1c;font-size:12px;font-weight:600;color:#9a9a9f}
        td button{background:#D4145A;color:#fff;border:0;padding:8px 18px;font-family:inherit;font-weight:600;font-size:12px;cursor:pointer}
        td button:hover{background:#b30f4a}
        .tag{font-size:12px;color:#9a9a9f}
        .ok{background:rgba(255,255,255,.08);padding:12px;margin-bottom:16px;font-size:13px}
        .err{background:rgba(212,20,90,.15);border:1px solid #D4145A;padding:12px;margin-bottom:16px;font-size:13px}
        .wrap{overflow-x:auto}
    </style>
</head>
<body>
<header>
    <a class="logo" href="/landing">Get U <span>Fit</span></a>
    <form method="post" th:action="@{/logout}"><button class="link" type="submit">Log out</button></form>
</header>
<main>
    <a th:href="@{/account}">&larr; My account</a>
    <h1>Class schedule</h1>
    <div class="ok" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <div class="wrap">
        <table>
            <tr><th>Class</th><th>Trainer</th><th>Date</th><th>Time</th><th>Type</th><th>Seats left</th><th></th></tr>
            <tr th:each="c : ${classes}">
                <td th:text="${c.className}"></td>
                <td th:text="${trainerNames[c.trainerID] != null ? trainerNames[c.trainerID] : 'Not assigned'}"></td>
                <td th:text="${c.classDate}"></td>
                <td th:text="${c.startTime + ' - ' + c.endTime}"></td>
                <td th:text="${c.classType}"></td>
                <td th:text="${seats[c.classID]}"></td>
                <td>
                    <span class="tag" th:if="${booked.contains(c.classID)}">Registered</span>
                    <span class="tag" th:if="${!booked.contains(c.classID) and seats[c.classID] <= 0}">Full</span>
                    <form th:if="${!booked.contains(c.classID) and seats[c.classID] > 0}" method="post" th:action="@{/account/classes/register}">
                        <input type="hidden" name="classId" th:value="${c.classID}">
                        <button type="submit">Register</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(classes)}"><td colspan="7">No upcoming classes right now.</td></tr>
        </table>
    </div>
</main>
</body>
</html>
