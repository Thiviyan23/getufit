<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Classes</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:1000px;margin:32px auto;padding:0 20px}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}
        th{background:#000;color:#fff}
        button{background:#D4145A;color:#fff;border:0;padding:8px 16px;border-radius:20px;cursor:pointer}
        .ok{background:#e6f7ec;padding:12px;margin-bottom:16px;border-radius:6px}
        .err{background:#fde8ee;color:#a80f47;padding:12px;margin-bottom:16px;border-radius:6px}
        select{padding:8px;margin:0 8px}
        a{color:#D4145A}
    </style>
</head>
<body>
<header>Get U <span>Fit</span></header>
<main>
    <h2>Class Schedule</h2>
    <form method="get" action="/classes">
        <label>Member:</label>
        <select name="memberId" onchange="this.form.submit()">
            <option value="">Select member</option>
            <option th:each="m : ${members}" th:value="${m.memberID}" th:text="${m.fullName}" th:selected="${m.memberID == memberId}"></option>
        </select>
        <a th:if="${memberId != null}" th:href="@{/registrations(memberId=${memberId})}">My registrations</a>
    </form>
    <br>
    <div class="ok" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <table>
        <tr><th>Class</th><th>Date</th><th>Time</th><th>Type</th><th>Seats left</th><th></th></tr>
        <tr th:each="c : ${classes}">
            <td th:text="${c.className}"></td>
            <td th:text="${c.classDate}"></td>
            <td th:text="${c.startTime + ' - ' + c.endTime}"></td>
            <td th:text="${c.classType}"></td>
            <td th:text="${seats[c.classID]}"></td>
            <td>
                <form th:if="${memberId != null}" method="post" action="/classes/register">
                    <input type="hidden" name="memberId" th:value="${memberId}">
                    <input type="hidden" name="classId" th:value="${c.classID}">
                    <button type="submit">Register</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
