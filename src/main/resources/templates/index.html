<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Home</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:1000px;margin:48px auto;padding:0 20px}
        h1{margin:0 0 8px}
        p{color:#555;margin:0 0 32px}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
        .card{display:block;background:#fff;padding:28px;border-radius:10px;text-decoration:none;color:#111;border-top:4px solid #D4145A;box-shadow:0 2px 8px rgba(0,0,0,.06)}
        .card:hover{background:#000;color:#fff}
        .card h3{margin:0 0 8px}
        .card span{font-size:14px;color:#888}
    </style>
</head>
<body>
<header>Get U <span>Fit</span></header>
<main>
    <h1>Welcome to Get U Fit</h1>
    <p>Fitness centre management system</p>
    <div class="grid">
        <a class="card" th:href="@{/members}"><h3>Members</h3><span>Add, edit and manage members</span></a>
        <a class="card" th:href="@{/classes}"><h3>Classes</h3><span>Schedule and registrations</span></a>
        <a class="card" th:href="@{/trainers}"><h3>Trainers</h3><span>Manage trainer profiles</span></a>
    </div>
</main>
</body>
</html>
