<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Application received - Get U Fit</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Poppins',Arial,sans-serif;background:#000;color:#fff;min-height:100vh;display:flex;flex-direction:column}
        header{padding:18px 40px;border-bottom:1px solid rgba(255,255,255,.08)}
        header a{color:#fff;font-weight:800;font-size:20px;text-decoration:none}
        header span{color:#D4145A}
        main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
        .box{max-width:480px}
        .tick{width:64px;height:64px;border-radius:50%;background:#D4145A;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:800}
        h1{font-size:30px;font-weight:800;margin-bottom:12px}
        p{color:#9a9a9f;font-size:14px;line-height:1.8}
        .btn{display:inline-block;margin-top:28px;background:#D4145A;color:#fff;padding:14px 30px;font-weight:700;font-size:12px;letter-spacing:.8px;text-transform:uppercase;text-decoration:none}
        .btn:hover{background:#b30f4a}
    </style>
</head>
<body>
<header><a href="/landing">Get U <span>Fit</span></a></header>
<main>
    <div class="box">
        <div class="tick" aria-hidden="true">&#10003;</div>
        <h1>Application received</h1>
        <p>Thank you for joining Get U Fit. Our staff will review your details and activate your membership. You can book classes once your account is active.</p>
        <a class="btn" href="/landing">Back to home</a>
    </div>
</main>
</body>
</html>
