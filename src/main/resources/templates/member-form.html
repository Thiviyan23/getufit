<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Member</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:560px;margin:32px auto;padding:0 20px}
        form{background:#fff;padding:28px;border-radius:8px}
        label{display:block;margin-top:16px;font-weight:bold}
        input,select{width:100%;padding:10px;margin-top:6px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
        button{background:#D4145A;color:#fff;border:0;padding:12px 24px;border-radius:24px;cursor:pointer;margin-top:24px}
        .e{color:#a80f47;font-size:13px}
        a{color:#D4145A}
    </style>
</head>
<body>
<header>Get U <span>Fit</span></header>
<main>
    <h2 th:text="${isNew} ? 'Add member' : 'Edit member'"></h2>
    <form method="post" th:object="${member}"
          th:action="${isNew} ? @{/members/new} : @{/members/{id}/edit(id=${memberId})}">
        <label>Full name</label>
        <input type="text" th:field="*{fullName}">
        <span class="e" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        <label>Date of birth</label>
        <input type="date" th:field="*{dob}">
        <span class="e" th:if="${#fields.hasErrors('dob')}" th:errors="*{dob}"></span>
        <label>Gender</label>
        <select th:field="*{gender}">
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
        </select>
        <span class="e" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></span>
        <label>Address</label>
        <input type="text" th:field="*{address}">
        <span class="e" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
        <label>Phone</label>
        <input type="text" th:field="*{phone}">
        <span class="e" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        <label>Email</label>
        <input type="text" th:field="*{email}">
        <span class="e" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
        <div th:if="${isNew}">

            <label>Password</label>
            <input type="password" name="password">
            <span class="e" th:if="${passwordError}" th:text="${passwordError}"></span>

            <label>Membership Package</label>
            <select name="packageId" id="packageSelect" onchange="updatePrice()">
                <option value="">Select a package</option>
                <option th:each="p : ${packages}" th:value="${p.packageID}" th:text="${p.packageName + ' - ' + p.durationMonths + ' months'}" th:attr="data-price=${p.price}"></option>
            </select>
            <span class="e" th:if="${packageError}" th:text="${packageError}"></span>
            <p id="priceDisplay" style="margin-top:8px;font-weight:bold;color:#D4145A;"></p>

            <label>Payment Method</label>
            <select name="paymentType">
                <option value="Cash">Cash</option>
                <option value="Card">Card</option>
                <option value="Bank Transfer">Bank Transfer</option>
            </select>

        </div>
        <script>
            function updatePrice(){
                var sel = document.getElementById('packageSelect');
                var opt = sel.options[sel.selectedIndex];
                var price = opt.getAttribute('data-price');
                document.getElementById('priceDisplay').innerText = price ? ('Price: LKR ' + price) : '';
            }
        </script>
        <button type="submit">Save</button>
        <a th:href="@{/members}">Cancel</a>
    </form>
</main>
</body>
</html>
