<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - My Registrations</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:1000px;margin:32px auto;padding:0 20px}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}
        th{background:#000;color:#fff}
        button{background:#000;color:#fff;border:0;padding:8px 16px;border-radius:20px;cursor:pointer}
        .ok{background:#e6f7ec;padding:12px;margin-bottom:16px;border-radius:6px}
        .err{background:#fde8ee;color:#a80f47;padding:12px;margin-bottom:16px;border-radius:6px}
        a{color:#D4145A}
    </style>
</head>
<body>
<header>Get U <span>Fit</span></header>
<main>
    <h2>My Registrations</h2>
    <a th:href="@{/classes(memberId=${memberId})}">Back to class schedule</a>
    <br><br>
    <div class="ok" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <table>
        <tr><th>Class</th><th>Date</th><th>Time</th><th>Registered on</th><th>Status</th><th></th></tr>
        <tr th:each="r : ${registrations}">
            <td th:text="${r.gymClass.className}"></td>
            <td th:text="${r.gymClass.classDate}"></td>
            <td th:text="${r.gymClass.startTime}"></td>
            <td th:text="${r.registrationDate}"></td>
            <td th:text="${r.status}"></td>
            <td>
                <form th:if="${r.status == 'Registered'}" method="post" action="/registrations/cancel">
                    <input type="hidden" name="registrationId" th:value="${r.registrationID}">
                    <input type="hidden" name="memberId" th:value="${memberId}">
                    <button type="submit">Cancel</button>
                </form>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
