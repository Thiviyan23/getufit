<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Manage Schedule</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:1200px;margin:32px auto;padding:0 20px}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}
        th{background:#000;color:#fff}
        button,.btn{background:#D4145A;color:#fff;border:0;padding:8px 16px;border-radius:20px;cursor:pointer;text-decoration:none;font-size:14px}
        .dark{background:#000}
        .ok{background:#e6f7ec;padding:12px;margin-bottom:16px;border-radius:6px}
        .err{background:#fde8ee;color:#a80f47;padding:12px;margin-bottom:16px;border-radius:6px}
        .row{display:flex;gap:8px}
        .past{color:#999}
        a{color:#D4145A}
    </style>
</head>
<body>
<header><a href="/" style="color:#fff;text-decoration:none">Get U <span>Fit</span></a></header>
<main>
    <h2>Manage Class Schedule</h2>
    <a class="btn" th:href="@{/schedule/new}">Schedule new class</a>
    <a th:href="@{/classes}">Member view</a>
    <a th:href="@{/trainers}">Trainers</a>
    <br><br>
    <div class="ok" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <table>
        <tr><th>Class</th><th>Trainer</th><th>Date</th><th>Time</th><th>Type</th><th>Booked</th><th></th></tr>
        <tr th:each="c : ${classes}" th:classappend="${c.classDate.isBefore(today)} ? 'past'">
            <td th:text="${c.className}"></td>
            <td th:text="${trainerNames[c.trainerID] != null ? trainerNames[c.trainerID] : 'Not assigned'}"></td>
            <td th:text="${c.classDate}"></td>
            <td th:text="${c.startTime + ' - ' + c.endTime}"></td>
            <td th:text="${c.classType}"></td>
            <td th:text="${booked[c.classID] + ' / ' + c.capacity}"></td>
            <td>
                <div class="row">
                    <a class="btn dark" th:href="@{/schedule/{id}/edit(id=${c.classID})}">Edit</a>
                    <form method="post" th:action="@{/schedule/{id}/delete(id=${c.classID})}"
                          onsubmit="return confirm('Delete this class?')">
                        <button type="submit">Delete</button>
                    </form>
                </div>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(classes)}"><td colspan="7">No classes scheduled yet.</td></tr>
    </table>
</main>
</body>
</html>
