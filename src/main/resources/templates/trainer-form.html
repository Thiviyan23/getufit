<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Trainer</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:560px;margin:32px auto;padding:0 20px}
        form{background:#fff;padding:28px;border-radius:8px}
        label{display:block;margin-top:16px;font-weight:bold}
        input,select{width:100%;padding:10px;margin-top:6px;box-sizing:border-box;border:1px solid #ccc;border-radius:6px}
        button{background:#D4145A;color:#fff;border:0;padding:12px 24px;border-radius:24px;cursor:pointer;margin-top:24px}
        .e{color:#a80f47;font-size:13px}
        .hint{color:#777;font-size:12px;margin-top:4px;display:block}
        a{color:#D4145A}
    </style>
</head>
<body>
<header><a href="/" style="color:#fff;text-decoration:none">Get U <span>Fit</span></a></header>
<main>
    <h2 th:text="${isNew} ? 'Add trainer' : 'Edit trainer'"></h2>
    <form method="post" th:object="${trainer}"
          th:action="${isNew} ? @{/trainers/new} : @{/trainers/{id}/edit(id=${trainerId})}">
        <label>Trainer name</label>
        <input type="text" th:field="*{trainerName}">
        <span class="e" th:if="${#fields.hasErrors('trainerName')}" th:errors="*{trainerName}"></span>

        <label>Specialization</label>
        <select th:field="*{specialization}">
            <option value="">Select specialization</option>
            <option th:each="s : ${specializations}" th:value="${s}" th:text="${s}"></option>
            <option th:if="${trainer.specialization != null and !trainer.specialization.isBlank() and !specializations.contains(trainer.specialization)}"
                    th:value="${trainer.specialization}" th:text="${trainer.specialization}"></option>
        </select>
        <span class="e" th:if="${#fields.hasErrors('specialization')}" th:errors="*{specialization}"></span>

        <label>Phone</label>
        <input type="text" th:field="*{phone}">
        <span class="e" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>

        <label>Email (used to log in)</label>
        <input type="text" th:field="*{email}">
        <span class="e" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>

        <label th:text="${isNew} ? 'Password' : 'New password'"></label>
        <input type="password" name="password" autocomplete="new-password">
        <span class="hint" th:unless="${isNew}">Leave blank to keep the current password.</span>
        <span class="hint" th:if="${isNew}">6 to 72 characters. Give this to the trainer so they can log in.</span>
        <span class="e" th:if="${passwordError}" th:text="${passwordError}"></span>

        <button type="submit">Save</button>
        <a th:href="@{/trainers}">Cancel</a>
    </form>
</main>
</body>
</html>
