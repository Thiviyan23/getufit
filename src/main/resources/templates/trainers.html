<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Get U Fit - Trainers</title>
    <style>
        body{margin:0;font-family:Arial,sans-serif;background:#f5f5f6;color:#111}
        header{background:#000;color:#fff;padding:18px 40px;font-size:22px;font-weight:bold}
        header span{color:#D4145A}
        main{max-width:1100px;margin:32px auto;padding:0 20px}
        table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
        th,td{padding:14px;text-align:left;border-bottom:1px solid #eee}
        th{background:#000;color:#fff}
        button,.btn{background:#D4145A;color:#fff;border:0;padding:8px 16px;border-radius:20px;cursor:pointer;text-decoration:none;font-size:14px}
        .dark{background:#000}
        .ok{background:#e6f7ec;padding:12px;margin-bottom:16px;border-radius:6px}
        .err{background:#fde8ee;color:#a80f47;padding:12px;margin-bottom:16px;border-radius:6px}
        .row{display:flex;gap:8px}
        a{color:#D4145A}
    </style>
</head>
<body>
<header><a href="/" style="color:#fff;text-decoration:none">Get U <span>Fit</span></a></header>
<main>
    <h2>Trainers</h2>
    <a class="btn" th:href="@{/trainers/new}">Add trainer</a>
    <a th:href="@{/members}">Members</a>
    <a th:href="@{/classes}">Class schedule</a>
    <br><br>
    <div class="ok" th:if="${message}" th:text="${message}"></div>
    <div class="err" th:if="${error}" th:text="${error}"></div>
    <table>
        <tr><th>Name</th><th>Specialization</th><th>Phone</th><th>Email</th><th>Status</th><th></th></tr>
        <tr th:each="t : ${trainers}">
            <td th:text="${t.trainerName}"></td>
            <td th:text="${t.specialization}"></td>
            <td th:text="${t.phone}"></td>
            <td th:text="${t.email}"></td>
            <td th:text="${t.status}"></td>
            <td>
                <div class="row">
                    <a class="btn dark" th:href="@{/trainers/{id}/classes(id=${t.trainerID})}">Classes</a>
                    <a class="btn dark" th:href="@{/trainers/{id}/edit(id=${t.trainerID})}">Edit</a>
                    <form method="post" th:action="@{/trainers/{id}/status(id=${t.trainerID})}">
                        <button type="submit" th:text="${t.status == 'Active' ? 'Deactivate' : 'Activate'}"></button>
                    </form>
                </div>
            </td>
        </tr>
    </table>
</main>
</body>
</html>
